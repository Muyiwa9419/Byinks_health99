
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Byinks Health - MediSphere</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    #boot-error { display: none; position: fixed; inset: 0; background: #fff; color: #ef4444; padding: 2rem; z-index: 9999; font-family: system-ui, sans-serif; overflow: auto; }
    .error-card { max-width: 600px; margin: 2rem auto; border: 2px solid #fee2e2; border-radius: 1.5rem; padding: 2rem; background: #fef2f2; }
  </style>
  <script>
    // Critical: Initialize process.env before any module loads
    window.process = { env: { API_KEY: "" } };
    
    window.onerror = function(msg, url, line, col, error) {
      const el = document.getElementById('boot-error');
      if (el) {
        el.style.display = 'block';
        el.innerHTML = `
          <div class="error-card">
            <h1 style="font-size: 1.5rem; font-weight: 900; margin-bottom: 1rem;">Platform Boot Error</h1>
            <p style="margin-bottom: 0.5rem;"><strong>Error:</strong> ${msg}</p>
            <p style="font-size: 0.8rem; color: #991b1b; margin-bottom: 1rem;">Location: ${url}:${line}:${col}</p>
            <pre style="background: #000; color: #0f0; padding: 1rem; border-radius: 0.5rem; font-size: 0.7rem; overflow-x: auto;">${error?.stack || 'No stack trace available'}</pre>
            <button onclick="location.reload()" style="margin-top: 1rem; background: #be123c; color: white; padding: 0.75rem 1.5rem; border-radius: 0.75rem; border: none; font-weight: bold; cursor: pointer;">Retry Boot Sequence</button>
          </div>
        `;
      }
      return false;
    };
  </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@19.0.0,react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="boot-error"></div>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
