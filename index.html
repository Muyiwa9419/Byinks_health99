
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Byinks Health - MediSphere</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    #boot-error { display: none; position: fixed; inset: 0; background: #fff1f2; color: #be123c; padding: 2rem; z-index: 9999; font-family: monospace; }
  </style>
  <script>
    // Critical Shim for browser-based process.env access
    window.process = { env: { API_KEY: "" } };
    
    // Global Error Logger for diagnostics
    window.onerror = function(msg, url, line, col, error) {
      const el = document.getElementById('boot-error');
      if (el) {
        el.style.display = 'block';
        el.innerHTML = `<h1>Critical Boot Error</h1><p>${msg}</p><small>${url}:${line}</small>`;
      }
      return false;
    };
  </script>
<script type="importmap">

}
</script>
</head>

</body>
</html>
